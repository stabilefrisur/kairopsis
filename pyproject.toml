[project]
name = "kairopsis"
version = "0.1.0"
description = "Relative-value idea generation dashboard powered by metapyle"
readme = "README.md"
authors = [
    { name = "Stabile Frisur", email = "26568863+stabilefrisur@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.2",
    "jinja2==3.1.6",
    "metapyle>=0.1.6",
    "pandas==3.0.6",
    "platformdirs==4.5.1",
    "pydantic==2.13.5",
    "tzdata==2026.4",
    "uvicorn==0.42.0",
]

[project.scripts]
kairopsis = "kairopsis:main"

[project.urls]
Repository = "https://github.com/stabilefrisur/kairopsis"
Documentation = "https://github.com/stabilefrisur/kairopsis/blob/main/src/kairopsis/docs/human-guide.md"
Issues = "https://github.com/stabilefrisur/kairopsis/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.18.2",
    "playwright==1.55.0",
    "pytest==8.4.2",
]

[tool.uv.build-backend]
source-include = ["docs/**", "tests/**", "scripts/**", "uv.lock", "CONTEXT.md", "AGENTS.md", ".python-version"]
